<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cursed Sigils</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:white;font-family:Georgia,serif;display:grid;place-items:center;min-height:100dvh}.game{position:relative;width:min(100vw,75dvh,600px);aspect-ratio:3/4}canvas{width:100%;height:100%;display:block}button{position:absolute;background:transparent;border:0;color:transparent;cursor:pointer;touch-action:manipulation;border-radius:50%;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid white}dialog{background:#10090c;color:white;border:1px solid #a33;padding:24px;max-width:85vw;text-align:center}dialog button{position:static;color:white;border:1px solid #a33;border-radius:5px;padding:10px 20px}#message{position:absolute;top:14%;left:5%;width:90%;text-align:center;color:#fff;font-size:clamp(11px,2.7vw,17px);text-shadow:0 1px 5px black;pointer-events:none}</style></head><body><main class=game><canvas width=1086 height=1448 id=c></canvas><div id=message aria-live=polite></div><div id=controls></div></main><dialog id=help><h2>Cursed Sigils</h2><p>Awaken every sigil. Tap once to preview the sigils that will change, then tap the same sigil again to confirm.</p><p>The upper sigil connects to both lower sigils. The lower sigils do not connect to each other.</p><p>Undo and restart are unlimited. Three hints are available.</p><button onclick="help.close()">Return</button></dialog><script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),img=new Image(),W=1086,H=1448;const nodes=[[543,459,108],[395,700,105],[691,700,105]],masks=[7,3,5];let state=1,selected=-1,history=[],hints=3,tip=-1;const msg=document.getElementById('message');let base;
function draw(){if(!base)return;ctx.putImageData(base,0,0);let pixels=ctx.getImageData(0,0,W,H),d=pixels.data;for(let i=0;i<3;i++){let [cx,cy,r]=nodes[i],on=!!(state&(1<<i));if(on===(i===0))continue;for(let y=cy-r;y<=cy+r;y++)for(let x=cx-r;x<=cx+r;x++){let dist=Math.hypot(x-cx,y-cy);if(dist>r)continue;let k=(y*W+x)*4,R=d[k],G=d[k+1],B=d[k+2],v=Math.max(R,G,B),a=Math.min(1,(r-dist)/5);let rgb=on?[Math.min(255,v*2.5+12),Math.min(255,v*.75),Math.min(255,v*3.8+24)]:[v*.22,v*.19,v*.24];for(let j=0;j<3;j++)d[k+j]=d[k+j]*(1-a)+rgb[j]*a;}}
if(state===7){for(let y=210;y<1000;y++)for(let x=140;x<950;x++){let k=(y*W+x)*4;if(d[k]>d[k+1]*1.65&&d[k]>d[k+2]*1.5){d[k]=Math.min(255,d[k]*3.7);d[k+1]=Math.min(255,d[k+1]*1.8);d[k+2]=Math.min(255,d[k+2]*1.5)}}}ctx.putImageData(pixels,0,0);
for(let i=0;i<3;i++){if((selected>=0&&(masks[selected]&(1<<i)))||tip===i){let [x,y,r]=nodes[i];ctx.beginPath();ctx.arc(x,y,r-3,0,Math.PI*2);ctx.strokeStyle=tip===i?'#ffdc8a':'#eacaff';ctx.lineWidth=4;ctx.setLineDash([10,7]);ctx.stroke();ctx.setLineDash([])}}
if(state!==1||history.length){ctx.fillStyle='#100b0c';ctx.fillRect(277,1030,205,44);ctx.fillRect(630,1030,200,44);ctx.fillStyle='#fff5ec';ctx.font='38px Georgia';ctx.textAlign='center';ctx.fillText(`${[0,1,2].filter(i=>state&(1<<i)).length} of 3 Lit`,380,1066);ctx.fillText(`Moves: ${history.length}`,730,1066)}if(hints!==3){ctx.fillStyle='#9b0000';ctx.beginPath();ctx.arc(873,1162,23,0,Math.PI*2);ctx.fill();ctx.fillStyle='white';ctx.font='30px Georgia';ctx.textAlign='center';ctx.fillText(hints,873,1173)} }
function choose(i){if(state===7)return;tip=-1;if(selected!==i){selected=i;msg.textContent='Tap again to confirm';}else{history.push(state);state^=masks[i];selected=-1;msg.textContent=state===7?'The seal awakens.':'';}draw();save()}
function save(){try{localStorage.setItem('cursed-sigils-v1',JSON.stringify({state,history,hints}))}catch(e){}}
function restart(){state=1;history=[];selected=tip=-1;msg.textContent='';draw();save()}
function hint(){if(!hints||state===7)return;let q=[[state,-1]],seen=new Set([state]);while(q.length){let [s,f]=q.shift();if(s===7){tip=f;selected=-1;hints--;msg.textContent='A sigil calls to you…';draw();save();return}masks.forEach((m,i)=>{let n=s^m;if(!seen.has(n)){seen.add(n);q.push([n,f<0?i:f])}})}}
